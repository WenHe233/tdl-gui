name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate tag and extract version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must match vX.Y.Z; received $tag"
          }
          "value=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build portable Windows package
        shell: pwsh
        run: .\scripts\build.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Create checksum
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $fileName = "TDL-Media-windows-x64-$version.zip"
          $zipPath = Join-Path "dist" $fileName
          $checksumPath = "$zipPath.sha256"
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/RELEASE_${{ steps.version.outputs.value }}.md"
          $notesArgs = @("--generate-notes")
          if (Test-Path -LiteralPath $notes) { $notesArgs = @("--notes-file", $notes) }
          gh release create "${{ github.ref_name }}" `
            "${{ steps.package.outputs.zip }}" `
            "${{ steps.package.outputs.checksum }}" `
            --verify-tag `
            @notesArgs `
            --title "TDL Media ${{ github.ref_name }}"
